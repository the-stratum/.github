
name: Gradle CI

on:
  push:
    branches: [$default-branch]
  pull_request:
    branches: [$default-branch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java from version file
        if: hashFiles('.java-version') != ''
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up default Java version
        if: hashFiles('.java-version') == ''
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          if [ ! -f ./gradlew ]; then
            echo "::error::Gradle Wrapper (gradlew) not found at the repository root."
            exit 1
          fi

          chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew build --no-daemon
