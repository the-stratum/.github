
name: Bug Report
description: Report a reproducible problem with a STRATUM project.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem.

        Before submitting, search existing issues to avoid duplicates.

        **Important:** Never include passwords, API keys, access tokens, private information, or other secrets. For security vulnerabilities, follow our [Security Policy](https://github.com/the-stratum/.github/blob/main/SECURITY.md) instead of creating a public issue.

  - type: input
    id: project
    attributes:
      label: Project or repository
      description: Identify the affected STRATUM project.
      placeholder: "Example: project-name or https://github.com/the-stratum/project-name"
    validations:
      required: true
      min_length: 3

  - type: input
    id: version
    attributes:
      label: Affected version or commit
      description: Provide the release version, branch, or commit where the problem occurs.
      placeholder: "Example: v1.2.0 or commit SHA"
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where did you encounter the problem?
      options:
        - Local installation
        - Self-hosted deployment
        - Hosted deployment
        - Website or dashboard
        - Discord bot or integration
        - API or external integration
        - Other
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      description: How often does this problem occur?
      options:
        - Every time
        - Frequently
        - Occasionally
        - Only once
        - Unable to determine
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Bug description
      description: Clearly explain what is going wrong.
      placeholder: Describe the problem and its impact.
    validations:
      required: true
      min_length: 20

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide clear, numbered steps so maintainers can reproduce the problem.
      placeholder: |
        1. Open...
        2. Navigate to...
        3. Perform...
        4. Observe the problem...
    validations:
      required: true
      min_length: 20

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: Explain what you expected to happen.
      placeholder: Describe the expected result.
    validations:
      required: true
      min_length: 10

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Explain what happened instead.
      placeholder: Describe the actual result.
    validations:
      required: true
      min_length: 10

  - type: textarea
    id: environment_details
    attributes:
      label: Technical environment
      description: Include relevant system, runtime, browser, dependency, and deployment details.
      placeholder: |
        - Operating system:
        - Runtime or language version:
        - Browser (if applicable):
        - Relevant dependencies:
        - Deployment platform (if applicable):
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs
      description: Include relevant errors, stack traces, or logs. Remove credentials and sensitive information first.
      placeholder: Paste relevant error output here.
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add relevant screenshots, references, workarounds, or other information.
      placeholder: Any additional information that may help the investigation.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Submission checklist
      options:
        - label: I searched existing issues for similar reports.
          required: true
        - label: I removed passwords, tokens, and other sensitive information.
          required: true
        - label: I understand that security vulnerabilities must be reported privately.
          required: true
